<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g>
    <!-- Calendar Frame -->
    <rect x="3" y="5" width="18" height="16" rx="1" stroke="currentColor" stroke-width="2"/>
    <!-- Header -->
    <line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="2"/>
    <!-- Date Numbers -->
    <circle cx="7" cy="14" r="1.5" fill="currentColor"/>
    <circle cx="12" cy="14" r="1.5" fill="currentColor"/>
    <circle cx="17" cy="14" r="1.5" fill="currentColor"/>
    <!-- Day Numbers -->
    <line x1="3" y1="3" x2="6" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="3" x2="21" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
