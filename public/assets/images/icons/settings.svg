    <rect x="19" y="11" width="3" height="2" fill="#2f7f87"/>
    
    <!-- Diagonal Teeth -->
    <rect x="19.5" y="4.5" width="2" height="2" fill="#2f7f87" transform="rotate(45 20.5 5.5)"/>
    <rect x="2.5" y="16.5" width="2" height="2" fill="#2f7f87" transform="rotate(45 3.5 17.5)"/>
