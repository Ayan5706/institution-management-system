    <!-- Gear Teeth Top -->
    <rect x="11" y="2" width="2" height="3" fill="#2f7f87"/>
    <rect x="11" y="19" width="2" height="3" fill="#2f7f87"/>
    
    <!-- Gear Teeth Sides -->
